aid: national-endowment-for-the-arts
name: National Endowment for the Arts
description: >-
  The National Endowment for the Arts is an independent federal agency that
  funds, promotes, and strengthens the creative capacity of our communities
  by providing all Americans with diverse opportunities for arts
  participation. NEA does not currently expose a documented public REST API;
  arts and culture data is available through partner programs such as the
  Arts and Cultural Production Satellite Account (with BEA) and the Survey
  of Public Participation in the Arts (with the U.S. Census Bureau).
